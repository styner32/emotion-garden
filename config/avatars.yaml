catalog_version: "v1"
schema_version: "appearance_v1"

face_presets:
  - id: "calm_oval"
    label: "담담한 계란형"
    description: "차분하고 균형 잡힌 기본 인상"
    recommended_for: ["grow", "release"]
  - id: "warm_round"
    label: "포근한 둥근형"
    description: "부드러운 눈썹과 편안한 턱선"
    recommended_for: ["grow"]
  - id: "sharp_stern"
    label: "날카롭고 까칠한 인상"
    description: "치켜올라간 눈썹과 단호한 턱선"
    recommended_for: ["release"]
  - id: "blunt_square"
    label: "무심하고 단단한 인상"
    description: "일자 눈썹과 각진 윤곽"
    recommended_for: ["release"]
  - id: "cynical_narrow"
    label: "예민하고 냉담한 인상"
    description: "좁은 미간과 차가운 분위기"
    recommended_for: ["release"]

